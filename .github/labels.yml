# Managed baseline label set for the repository: every label below should
# exist, but this file is additive, not canonical or exhaustive — live GitHub
# may carry further topical labels this baseline doesn't enumerate. Kept lean
# (lean-docs) and stable so contributors inherit a clear workflow from the
# start. Apply with `gh label create`/`gh label edit` (or an additive
# label-sync step) against this file; never destructively sync labels that
# only exist live.
#
# Each description owns its label's meaning: when to apply it and, for state
# labels, when to remove it. GitHub caps label descriptions at 100 characters.

# --- Subsystem / area ---
- name: roadmap
  color: "5319e7"
  description: Roadmap / design-task work toward a v1 acceptance criterion.
- name: rust
  color: "dea584"
  description: Rust source, workspace, or toolchain changes.
- name: assets
  color: "c2e0c6"
  description: Extracted/transcoded data, graphics, audio, maps.
- name: engine
  color: "0e8a16"
  description: Overworld, scripts, dialog, save, RNG, menus.
- name: battle
  color: "b60205"
  description: Battle state machine, moves, AI, animations, UI.
- name: docs
  color: "0075ca"
  description: Documentation and contributor guides.

# --- Process / infra ---
- name: release
  color: "1d76db"
  description: Release process, versioning, tagging, packaging.
- name: ci
  color: "fbca04"
  description: CI/CD workflows and status checks.
- name: ledger
  color: "fef2c0"
  description: Coverage ledger (ledger/) entries and verification.

# --- Review / gating ---
- name: needs-review
  color: "d4c5f9"
  description: Not yet triaged (issue) or awaiting a reviewer's verdict (PR). Remove once triaged or reviewed.
- name: needs-split
  color: "c5def5"
  description: Valid work too large for one focused change; split it into sub-issues before implementing.
- name: needs-operator
  color: "e99695"
  description: Blocked on a genuine human decision, incl. player-channel promotion signoff.
- name: snapshot-review-needed
  color: "bfd4f2"
  description: Visual/audio snapshots need human blessing, not hash alone.
- name: waiver-required
  color: "fad8c7"
  description: Needs a recorded waiver to proceed past a gate.

# --- Severity / risk ---
- name: release-blocker
  color: "b60205"
  description: Must be resolved before any release can be cut.
- name: breaking-change
  color: "d93f0b"
  description: Breaks a repository contract or player-visible compatibility.
- name: save-data-risk
  color: "e11d21"
  description: May corrupt, migrate, or invalidate save data — handle with care.
- name: performance-regression
  color: "e11d21"
  description: Measured regression against a release-mode performance budget.

# --- Branch regressions (release ladder) ---
- name: main-regression
  color: "8b0000"
  description: Regression observed on the main (stable release) branch.
- name: stable-regression
  color: "b60205"
  description: Regression observed on the stable (beta) branch.
- name: unstable-regression
  color: "d93f0b"
  description: Regression observed on the unstable (nightly) branch.

# --- Maintenance / pipeline state ---
- name: routine
  color: "5319e7"
  description: Routine maintenance found while reviewing dev; advances no v1 acceptance ID.
- name: soaking
  color: "fbca04"
  description: Held open to soak before merge or promotion; not yet eligible to merge.
- name: ready-to-merge
  color: "0e8a16"
  description: Reviewed and green; eligible to merge.
- name: blocked
  color: "000000"
  description: Cannot proceed until a dependency or decision clears; the issue names which one.

# --- Contributor onboarding ---
- name: good-first-issue
  color: "7057ff"
  description: Good entry point for a new contributor.
- name: help-wanted
  color: "008672"
  description: Maintainer is actively seeking help on this.
