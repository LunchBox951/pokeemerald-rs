# Prevent known-vulnerable dependency changes from entering through a pull
# request. This complements (rather than replaces) owner approval under
# minimal-deps: a clean advisory result is not dependency approval.
name: dependency-review

on:
  pull_request:
    branches: [dev, unstable, stable, main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-scopes: runtime, development, unknown
