# Structural enforcement for the direct release ladder.
#
# Each protected player channel accepts exactly one same-repository source:
#
#   dev -> unstable -> stable -> main
#
# The target suffix in the check name is security-sensitive. Required checks
# are associated with a head SHA, so a shared context could stay green if a PR
# were retargeted. `source-gate / <base>` makes every rung require a distinct
# result and re-binds both refs to the live pull request before succeeding.
name: channel-merge-policy

on:
  pull_request:
    branches: [unstable, stable, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  source-gate:
    name: source-gate / ${{ github.base_ref }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PROMOTION_APP_LOGIN: ${{ vars.PROMOTION_APP_LOGIN }}
    steps:
      - name: Require the exact live channel pair
        env:
          EVENT_BASE: ${{ github.base_ref }}
          EVENT_HEAD: ${{ github.head_ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A failure inside a function called via command substitution
          # (e.g. `x="$(some_func)"`) must abort the run, not read as "$()".
          shopt -s inherit_errexit

          case "${EVENT_BASE}" in
            unstable) expected_head="dev" ;;
            stable)   expected_head="unstable" ;;
            main)     expected_head="stable" ;;
            *)
              echo "::error::Unexpected channel target ${EVENT_BASE}."
              exit 1
              ;;
          esac

          if [[ "${EVENT_HEAD_REPO}" != "${REPOSITORY}" ]]; then
            echo "::error::${EVENT_BASE} accepts only ${REPOSITORY}:${expected_head}; forks are not promotion sources."
            exit 1
          fi
          if [[ "${EVENT_HEAD}" != "${expected_head}" ]]; then
            echo "::error::${EVENT_BASE} accepts only ${expected_head}, not ${EVENT_HEAD}."
            exit 1
          fi
          if [[ -z "${PROMOTION_APP_LOGIN}" ]]; then
            echo "::error::PROMOTION_APP_LOGIN is not configured."
            exit 1
          fi
          if [[ "${PROMOTION_APP_LOGIN}" != ?*'[bot]' ]]; then
            echo "::error::PROMOTION_APP_LOGIN must be the REST-form <slug>[bot] login with a non-empty slug, not ${PROMOTION_APP_LOGIN}."
            exit 1
          fi
          promotion_app_slug="${PROMOTION_APP_LOGIN%\[bot\]}"

          # The configured App is one identity behind two representations:
          # REST uses "<slug>[bot]" (PROMOTION_APP_LOGIN); GraphQL uses "app/<slug>".
          is_promotion_app_author() {
            [[ "$1" == "${PROMOTION_APP_LOGIN}" || "$1" == "app/${promotion_app_slug}" ]]
          }

          live="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          live_base="$(jq -r '.base.ref' <<<"${live}")"
          live_head="$(jq -r '.head.ref' <<<"${live}")"
          live_head_sha="$(jq -r '.head.sha' <<<"${live}")"
          live_head_repo="$(jq -r '.head.repo.full_name' <<<"${live}")"
          live_author="$(jq -r '.user.login' <<<"${live}")"

          if [[ "${live_base}" != "${EVENT_BASE}" \
            || "${live_head}" != "${EVENT_HEAD}" \
            || "${live_head_sha}" != "${EVENT_HEAD_SHA}" \
            || "${live_head_repo}" != "${REPOSITORY}" ]]; then
            echo "::error::Pull request base/head changed during policy evaluation; rerun against the live state."
            exit 1
          fi
          if ! is_promotion_app_author "${live_author}"; then
            echo "::error::Promotion PR must be opened by ${PROMOTION_APP_LOGIN} (REST) or app/${promotion_app_slug} (GraphQL), not ${live_author}."
            exit 1
          fi

          duplicates="$(gh pr list \
            --repo "${REPOSITORY}" \
            --state open \
            --base "${EVENT_BASE}" \
            --head "${EVENT_HEAD}" \
            --json headRepository,number \
            --jq '[.[] | select(.headRepository.nameWithOwner == "'"${REPOSITORY}"'")] | length')"
          if [[ "${duplicates}" != "1" ]]; then
            echo "::error::Expected exactly one open ${EVENT_HEAD}->${EVENT_BASE} promotion PR; found ${duplicates}."
            exit 1
          fi

          case "${EVENT_BASE}" in
            stable) preceding_head="dev" ;;
            main)   preceding_head="unstable" ;;
            *)      preceding_head="" ;;
          esac
          if [[ -n "${preceding_head}" ]]; then
            candidate_logins="$(gh pr list \
              --repo "${REPOSITORY}" \
              --state merged \
              --base "${EVENT_HEAD}" \
              --head "${preceding_head}" \
              --limit 100 \
              --json author,baseRefName,headRefName,headRepository,mergeCommit \
              --jq '[.[] | select(
                .headRepository.nameWithOwner == "'"${REPOSITORY}"'" and
                .baseRefName == "'"${EVENT_HEAD}"'" and
                .headRefName == "'"${preceding_head}"'" and
                .mergeCommit.oid == "'"${EVENT_HEAD_SHA}"'"
              ) | .author.login]')"
            # A jq failure here must abort, not silently count as zero matches.
            candidate_login_lines="$(jq -r '.[]' <<<"${candidate_logins}")"
            provenance=0
            while IFS= read -r candidate_login; do
              if [[ -n "${candidate_login}" ]] && is_promotion_app_author "${candidate_login}"; then
                provenance=$((provenance + 1))
              fi
            done <<<"${candidate_login_lines}"
            if [[ "${provenance}" != "1" ]]; then
              echo "::error::${EVENT_HEAD}@${EVENT_HEAD_SHA} is not the merge commit of the preceding App-created ${preceding_head}->${EVENT_HEAD} promotion."
              exit 1
            fi
          fi

          echo "OK: live promotion pair is ${EVENT_HEAD}->${EVENT_BASE} at ${EVENT_HEAD_SHA}."
