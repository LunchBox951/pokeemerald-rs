# Release pipeline for pokeemerald-rs. See docs/acceptance/v1.md.
#
# Triggers only on versioned pushes to main (changes under VERSION, CHANGELOG,
# this workflow, or scripts/**). It reads the canonical VERSION file, computes
# the tag v${version}, builds per-OS artifacts, and publishes a GitHub Release.
#
# build-linux/build-windows run `cargo build --release --workspace` (matching
# the `build` job in ci.yml) and package the resulting `pokeemerald-rs` binary
# into a version-named archive alongside README.md/CHANGELOG.md.
name: release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - CHANGELOG.md
      - .github/workflows/release.yml
      - scripts/**

# Most jobs only read the source. The publishing job grants itself the write
# token it needs below.
permissions:
  contents: read

jobs:
  # Read VERSION, derive the tag, and expose both as job outputs.
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      final: ${{ steps.read.outputs.final }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Read VERSION and compute tag
        id: read
        run: |
          version="$(cat VERSION)"
          tag="v${version}"
          final="${version%%.*}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "final=${final}" >> "$GITHUB_OUTPUT"
      - name: Validate version before release
        run: python3 scripts/version_check.py --base origin/main --head HEAD

  # Linux build: `cargo build --release`, then package the binary (+ docs)
  # into a version-named tarball.
  build-linux:
    name: build-linux
    needs: setup
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install ALSA dev headers (Linux; crates/platform's cpal dependency links libasound at compile time)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: cargo build --release --workspace
        run: cargo build --release --workspace
      - name: Package Linux archive
        run: |
          pkg="pokeemerald-rs-${VERSION}-linux"
          mkdir -p "dist/${pkg}"
          cp target/release/pokeemerald-rs "dist/${pkg}/"
          cp README.md CHANGELOG.md "dist/${pkg}/"
          tar -czf "dist/${pkg}.tar.gz" -C dist "${pkg}"
          rm -rf "dist/${pkg}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pokeemerald-rs-${{ needs.setup.outputs.version }}-linux
          path: dist/

  # Windows build: `cargo build --release`, then package the binary (+ docs)
  # into a version-named zip.
  build-windows:
    name: build-windows
    needs: setup
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: cargo build --release --workspace
        run: cargo build --release --workspace
      - name: Package Windows archive
        shell: pwsh
        run: |
          $pkg = "pokeemerald-rs-${env:VERSION}-windows"
          New-Item -ItemType Directory -Path "dist/$pkg" -Force | Out-Null
          Copy-Item target/release/pokeemerald-rs.exe "dist/$pkg/"
          Copy-Item README.md, CHANGELOG.md "dist/$pkg/"
          Compress-Archive -Path "dist/$pkg/*" -DestinationPath "dist/$pkg.zip"
          Remove-Item -Recurse -Force "dist/$pkg"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pokeemerald-rs-${{ needs.setup.outputs.version }}-windows
          path: dist/

  # Create the GitHub Release, attaching both build artifacts.
  # FINAL=0 releases are prereleases; stable (FINAL>=1) is maintainer-gated.
  release:
    name: release
    needs: [setup, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates tags and GitHub Releases
    env:
      TAG: ${{ needs.setup.outputs.tag }}
      VERSION: ${{ needs.setup.outputs.version }}
      FINAL: ${{ needs.setup.outputs.final }}
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pokeemerald-rs-${{ needs.setup.outputs.version }}-linux
          path: artifacts/linux
      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pokeemerald-rs-${{ needs.setup.outputs.version }}-windows
          path: artifacts/windows
      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=""
          if [ "${FINAL}" = "0" ]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "${TAG}" \
            --title "Release ${TAG}" \
            --generate-notes \
            ${prerelease_flag} \
            artifacts/linux/* artifacts/windows/*
