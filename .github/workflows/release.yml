# Publish channel binaries after protected-branch promotion.
name: release

on:
  push:
    branches: [unstable, main]
    paths:
      - VERSION
      - CHANGELOG.md
      - .github/workflows/release.yml
      - scripts/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Read VERSION, derive the tag, and expose both as job outputs.
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      package: ${{ steps.read.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Read VERSION and compute tag
        id: read
        run: |
          python3 scripts/channel_release.py metadata \
            --channel "${GITHUB_REF_NAME}" --version "$(cat VERSION)" >>"${GITHUB_OUTPUT}"
      - name: Validate version before release
        env:
          # Validate this push against the channel's
          # state before the push, not the updated remote ref (which includes
          # the push and would make every check a self-comparison no-op).
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          base="${BEFORE_SHA}"
          if [ -z "${base}" ] || ! git cat-file -e "${base}" 2>/dev/null; then
            base="HEAD^1"
          fi
          python3 scripts/version_check.py --mode cumulative \
            --base "${base}" --head HEAD --require-bump

  # Linux build: `cargo build --release`, then package the binary (+ docs)
  # into a version-named tarball.
  build-linux:
    name: build-linux
    needs: setup
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.setup.outputs.package }}
      POKEEMERALD_RELEASE_CHANNEL: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install ALSA dev headers (Linux; crates/platform's cpal dependency links libasound at compile time)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: cargo build --release --workspace
        run: cargo build --release --workspace --locked
      - name: Verify compiled channel data paths
        run: cargo test -p engine -p pack-format --test release_channel --locked
      - name: Package Linux archive
        run: |
          pkg="pokeemerald-rs-${VERSION}-linux"
          mkdir -p "dist/${pkg}"
          cp target/release/pokeemerald-rs "dist/${pkg}/"
          cp README.md CHANGELOG.md "dist/${pkg}/"
          tar -czf "dist/${pkg}.tar.gz" -C dist "${pkg}"
          rm -rf "dist/${pkg}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pokeemerald-rs-${{ needs.setup.outputs.package }}-linux
          path: dist/

  # Windows build: `cargo build --release`, then package the binary (+ docs)
  # into a version-named zip.
  build-windows:
    name: build-windows
    needs: setup
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.setup.outputs.package }}
      POKEEMERALD_RELEASE_CHANNEL: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: cargo build --release --workspace
        run: cargo build --release --workspace --locked
      - name: Verify compiled channel data paths
        run: cargo test -p engine -p pack-format --test release_channel --locked
      - name: Package Windows archive
        shell: pwsh
        run: |
          $pkg = "pokeemerald-rs-${env:VERSION}-windows"
          New-Item -ItemType Directory -Path "dist/$pkg" -Force | Out-Null
          Copy-Item target/release/pokeemerald-rs.exe "dist/$pkg/"
          Copy-Item README.md, CHANGELOG.md "dist/$pkg/"
          Compress-Archive -Path "dist/$pkg/*" -DestinationPath "dist/$pkg.zip"
          Remove-Item -Recurse -Force "dist/$pkg"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pokeemerald-rs-${{ needs.setup.outputs.package }}-windows
          path: dist/

  # Create the GitHub Release, attaching both build artifacts.
  # Nightlies and FINAL=0 releases are prereleases.
  release:
    name: release
    needs: [setup, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates tags and GitHub Releases
    env:
      TAG: ${{ needs.setup.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pokeemerald-rs-${{ needs.setup.outputs.package }}-linux
          path: artifacts/linux
      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pokeemerald-rs-${{ needs.setup.outputs.package }}-windows
          path: artifacts/windows
      # Binds refs/tags/${TAG} to GITHUB_SHA before publication; see
      # scripts/release_tag.py for the contract (F-5, #445).
      - name: Bind the release tag to this run's exact commit
        run: |
          python3 scripts/release_tag.py \
            --remote origin \
            --tag "${TAG}" \
            --target "${GITHUB_SHA}"
      - name: Publish complete channel release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/channel_release.py publish \
            --channel "${GITHUB_REF_NAME}" --version "$(cat VERSION)" \
            --repository "${GH_REPO}" --sha "${GITHUB_SHA}" --artifacts artifacts
