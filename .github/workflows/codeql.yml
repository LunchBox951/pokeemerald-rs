# This repository owns CodeQL advanced setup for Actions, Python, and Rust.
name: codeql

on:
  push:
    branches: [dev, unstable, stable, main]
  pull_request:
    branches: [dev, unstable, stable, main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            config_file: ""
          - language: python
            config_file: ""
          - language: rust
            config_file: ./.github/codeql/codeql-config.yml
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ${{ matrix.config_file }}
          tools: linked
      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          upload: always
