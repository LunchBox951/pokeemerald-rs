# CI merge gate for pokeemerald-rs. See docs/acceptance/v1.md.
#
# Pull requests into channel branches run once here; ordinary
# feature-branch pushes do not duplicate the pull_request run. Direct channel
# pushes still receive post-merge validation. Promotion PRs are opened with a
# dedicated GitHub App token, so their pull_request workflows run without the
# approval hold applied to GITHUB_TOKEN-created pull requests. Superseded runs
# for the same PR or ref are cancelled by the concurrency group below.
#
# `policy` owns the Ubuntu-only repository checks and the exact default format
# command. `native` gives each supported OS one checkout and one shared Cargo
# target directory for the exact default-feature Clippy/build/test commands
# plus smoke validation. Ubuntu also runs the all-feature Clippy gate, restores
# the pinned upstream references, extracts the real asset pack, runs the ignored
# real-pack and real-checkout assertions, and repeats smoke with the pack
# present. No Cargo target cache is used: reuse is deliberately limited to
# commands within one native runner.
#
# Branch rules require `merge-gate / <target>` from this workflow. The target
# suffix is load-bearing: GitHub keys checks by head SHA, so distinct names keep
# a green dev->unstable result from satisfying a PR retargeted to stable. The
# `always()` condition makes policy failures and failed/cancelled matrix legs
# visible through that one target-specific aggregate context.
name: ci

permissions:
  contents: read

on:
  push:
    branches: [dev, unstable, stable, main]
  pull_request:
    branches: [dev, unstable, stable, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # version_check needs the comparison base.
      - name: Validate VERSION
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          PUSH_BEFORE: ${{ github.event.before || '' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          validation_mode="$(python3 scripts/channel_ladder.py validation-mode \
            --event "${EVENT_NAME}" \
            --ref "${GITHUB_REF_NAME}" \
            --base "${PR_BASE_REF}" \
            --head "${PR_HEAD_REF}" \
            --head-repository "${PR_HEAD_REPO}" \
            --repository "${REPOSITORY}")"

          if [[ -n "${PR_BASE_SHA}" ]]; then
            git fetch --no-tags origin \
              "+refs/heads/${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"
            live_base="$(git rev-parse --verify \
              "refs/remotes/origin/${PR_BASE_REF}^{commit}")"
            if [[ "${live_base}" != "${PR_BASE_SHA}" ]]; then
              echo "::error::PR base advanced from ${PR_BASE_SHA} to ${live_base}; refresh the branch and rerun CI."
              exit 1
            fi

            python3 scripts/version_check.py --mode "${validation_mode}" \
              --base "${live_base}" --head HEAD --require-bump
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
              python3 scripts/version_check.py --mode "${validation_mode}" \
                --base "${PUSH_BEFORE}" --head HEAD
            else
              next_channel="$(
                python3 scripts/channel_ladder.py target-for "${GITHUB_REF_NAME}"
              )"
              git fetch --no-tags origin \
                "+refs/heads/${next_channel}:refs/remotes/origin/${next_channel}"
              next_head="$(git rev-parse --verify \
                "refs/remotes/origin/${next_channel}^{commit}")"
              python3 scripts/version_check.py --mode "${validation_mode}" \
                --base "${next_head}" --head HEAD
            fi
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            python3 scripts/version_check.py --mode "${validation_mode}" \
              --base HEAD --head HEAD
          else
            echo "::error::Unsupported VERSION validation event ${EVENT_NAME}."
            exit 1
          fi
      - name: Verify ledger
        run: python3 scripts/ledger.py verify
      - name: Run script test suites
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Run init.sh regression tests
        run: bash init_test.sh
      - name: cargo fmt --check
        run: cargo fmt --check

  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install ALSA dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: cargo clippy --workspace --all-targets --locked -- -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: cargo build --release --workspace
        run: cargo build --release --workspace
      - name: cargo test --workspace
        run: cargo test --workspace
      # The default workspace test above covers xtask without `smoke`; keep
      # this separate invocation so the optional smoke feature is also tested.
      - name: cargo test -p xtask --features smoke
        run: cargo test -p xtask --features smoke
      - name: Smoke E2E (packless)
        run: cargo run -p xtask --features smoke -- e2e --suite smoke

      # The clone/extraction pipeline is platform-independent. One Ubuntu leg
      # supplies real-asset coverage without tripling upstream clone work.
      - name: Restore pinned upstream references
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            pokeemerald
            mgba
          key: real-pack-upstream-${{ hashFiles('init.sh') }}
      - name: Fetch pinned upstream references
        if: runner.os == 'Linux'
        run: ./init.sh
      - name: Extract real asset pack
        if: runner.os == 'Linux'
        run: cargo run -p xtask -- extract
      - name: Run ignored real-pack assertions
        if: runner.os == 'Linux'
        run: cargo test -p pokeemerald-rs -- --ignored
      - name: Run ignored real-pack assertions (assets)
        if: runner.os == 'Linux'
        run: cargo test -p assets -- --ignored
      # `extract_dispatch_succeeds_with_local_checkout` rewrites the shared
      # assets-pack/ output (deterministically — extraction is byte-identical
      # across runs), so this step must stay between "Extract real asset pack"
      # and the smoke step that reads the pack.
      - name: Run ignored real-checkout assertions (xtask)
        if: runner.os == 'Linux'
        run: cargo test -p xtask --features record-snapshot,scenario -- --ignored
      - name: Smoke E2E (pack present)
        if: runner.os == 'Linux'
        run: cargo run -p xtask --features smoke -- e2e --suite smoke

  merge-gate:
    name: merge-gate / ${{ github.event.pull_request.base.ref || github.ref_name }}
    if: ${{ always() }}
    needs: [policy, native]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to succeed
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "${POLICY_RESULT}" = success
          test "${NATIVE_RESULT}" = success
