# CI merge gate for pokeemerald-rs. See docs/acceptance/v1.md.
#
# Pull requests into channel or release branches run once here; feature-branch
# pushes do not duplicate the pull_request run. Direct channel-branch pushes
# still receive post-merge validation. Superseded runs for the same PR or ref
# are cancelled by the concurrency group below.
#
# `policy` owns the Ubuntu-only repository checks and the exact default format
# command. `native` gives each supported OS one checkout and one shared Cargo
# target directory for the exact default Clippy/build/test commands plus smoke
# validation. On Ubuntu, that same workspace also restores the pinned upstream
# references, extracts the real asset pack, runs the ignored real-pack
# assertions, and repeats smoke with the pack present. No Cargo target cache is
# used: reuse is deliberately limited to commands within one native runner.
#
# Branch protection requires only `merge-gate` from this workflow. Its
# `always()` condition makes policy failures and failed/cancelled matrix legs
# visible through one stable context. Repository controls must replace the old
# per-command contexts atomically only after all new jobs have reported once;
# see RELEASE.md's "Repository controls go-live" section.
name: ci

permissions:
  contents: read

on:
  push:
    branches: [dev, unstable, stable, main]
  pull_request:
    branches: [dev, unstable, stable, main, "release/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # version_check needs the comparison base.
      - name: Validate VERSION
        env:
          # Compare a PR with its actual base. Push/manual runs retain the
          # repository-wide origin/main monotonicity check.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          base="${PR_BASE_SHA:-origin/main}"
          python3 scripts/version_check.py --base "${base}" --head HEAD
      - name: Verify ledger
        run: python3 scripts/ledger.py verify
      - name: Run script test suites
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Run init.sh regression tests
        run: bash init_test.sh
      - name: Ensure rustfmt component
        run: rustup component add rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check

  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install ALSA dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Ensure clippy component (Linux)
        if: runner.os == 'Linux'
        run: rustup component add clippy
      - name: cargo clippy --all-targets --workspace -- -D warnings
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --workspace -- -D warnings
      - name: cargo build --release --workspace
        run: cargo build --release --workspace
      - name: cargo test --workspace
        run: cargo test --workspace
      # The default workspace test above covers xtask without `smoke`; keep
      # this separate invocation so the optional smoke feature is also tested.
      - name: cargo test -p xtask --features smoke
        run: cargo test -p xtask --features smoke
      - name: Smoke E2E (packless)
        run: cargo run -p xtask --features smoke -- e2e --suite smoke

      # The clone/extraction pipeline is platform-independent. One Ubuntu leg
      # supplies real-asset coverage without tripling upstream clone work.
      - name: Restore pinned upstream references
        if: runner.os == 'Linux'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            pokeemerald
            mgba
          key: real-pack-upstream-${{ hashFiles('init.sh') }}
      - name: Fetch pinned upstream references
        if: runner.os == 'Linux'
        run: ./init.sh
      - name: Extract real asset pack
        if: runner.os == 'Linux'
        run: cargo run -p xtask -- extract
      - name: Run ignored real-pack assertions
        if: runner.os == 'Linux'
        run: cargo test -p pokeemerald-rs -- --ignored
      - name: Smoke E2E (pack present)
        if: runner.os == 'Linux'
        run: cargo run -p xtask --features smoke -- e2e --suite smoke

  merge-gate:
    name: merge-gate
    if: ${{ always() }}
    needs: [policy, native]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to succeed
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "${POLICY_RESULT}" = success
          test "${NATIVE_RESULT}" = success
