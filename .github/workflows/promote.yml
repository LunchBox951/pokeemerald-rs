# Release-channel promotion automation. See RELEASE.md (the `release/*` model).
#
# A long-lived `release/X` branch is the vehicle that climbs the gated ladder
# `dev → unstable → stable → main`. This workflow does the mechanical PR-opening
# so the maintainer only has to review and gate:
#
#   * When a `release/*` branch is CREATED, open its `release/X → unstable` PR
#     (the start of a promotion cycle).
#   * When a `release/*` branch is MERGED into a rung (a push to `unstable` or
#     `stable`), open the next-rung PR from the same `release/X`.
#
# Player channels (`stable`, `main`) still require human signoff before merge —
# this only opens the PR; it never merges one.
#
# No rung-skipping: this only ever opens the NEXT rung (unstable -> stable ->
# main), so nothing reaches `main` without clearing `unstable` and `stable` first
# — there is no `dev -> main` shortcut, even for a consolidated release branch.
#
# ASSUMPTIONS (verify once live, R-4):
#   * Promotions use a MERGE COMMIT, not squash — the ancestor checks below rely
#     on `release/X` history being preserved in the channel branch.
#   * Repo setting "Allow GitHub Actions to create and approve pull requests" is
#     ON. A maintainer with write access approves the workflow runs that GitHub
#     holds for each GITHUB_TOKEN-created PR (see docs go-live runbook).
#   * Default workflow permissions are read-only; this workflow's explicit
#     `pull-requests: write` grant is the narrow exception used to open PRs.
#   * The labels `release`, `needs-review`, and `needs-operator` already exist
#     (created from .github/labels.yml at go-live) — `gh pr create --label` fails
#     on a missing label.
name: promote

on:
  push:
    branches: [unstable, stable, "release/**"]
  create:

permissions:
  contents: read
  pull-requests: write

# Reconciliation is check-then-act over live PR state: overlapping runs could
# clobber each other (a stale run closing a newer run's correctly-routed PR).
# Serialize the whole workflow — promotion events are rare, and queued runs
# re-read live state when they start.
concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: open-promotion-pr
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history so the ancestor checks below can resolve

      # Cycle start: a new `release/*` branch was created -> open it into unstable.
      - name: Open cycle-start PR (release/* -> unstable)
        if: github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/')
        env:
          # Bind the untrusted ref to an env var; never interpolate ${{ }} into
          # the shell directly (branch names can carry shell metacharacters).
          EVENT_REF: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          release_branch="${EVENT_REF}"
          target="unstable"
          if git merge-base --is-ancestor "origin/${release_branch}" "origin/${target}"; then
            echo "${release_branch} already contained in ${target}; nothing to open."
            exit 0
          fi
          existing="$(gh pr list --head "${release_branch}" --base "${target}" --state open --json number --jq 'length')"
          if [ "${existing}" != "0" ]; then
            echo "Promotion PR ${release_branch} -> ${target} already open."
            exit 0
          fi
          gh pr create \
            --head "${release_branch}" \
            --base "${target}" \
            --title "Promote ${release_branch} → ${target}" \
            --body "$(printf 'Automated cycle-start promotion opened by promote.yml when %s was created.\n\nCandidate: `%s` @ %s\nGates for **%s** are in RELEASE.md — attach evidence before merge. A maintainer with write access must select **Approve workflows to run** before the required checks start.' "${release_branch}" "${release_branch}" "$(git rev-parse --short "origin/${release_branch}")" "${target}")" \
            --label "release" \
            --label "needs-review"

      # Reconciliation: any push to a release/* branch re-derives where that
      # branch should be promoted and corrects its open promotion PRs. This
      # is what makes routing eventually consistent: no matter when a branch
      # advances relative to the steps below (every check-then-act sequence
      # has a residual window), the advance itself triggers a fresh
      # reconciliation, and require-rung-cleared fails closed in between.
      - name: Reconcile promotion PRs (release/* moved)
        if: github.event_name == 'push' && startsWith(github.ref_name, 'release/')
        run: |
          set -euo pipefail
          release_branch="${GITHUB_REF_NAME}"
          target="$(scripts/select_promotion_target.sh "${release_branch}")"
          for base in unstable stable main; do
            if [ "${base}" = "${target}" ]; then
              continue
            fi
            for n in $(gh pr list --head "${release_branch}" --base "${base}" --state open --json number --jq '.[].number'); do
              gh pr close "${n}" --comment "$(printf '%s moved and now routes to %s; closing this misrouted promotion PR (promote.yml reconciliation).' "${release_branch}" "${target:-no rung (contained in every channel)}")"
            done
          done
          if [ -z "${target}" ]; then
            echo "${release_branch} contained in every channel; nothing to open."
            exit 0
          fi
          existing="$(gh pr list --head "${release_branch}" --base "${target}" --state open --json number --jq 'length')"
          if [ "${existing}" != "0" ]; then
            echo "Promotion PR ${release_branch} -> ${target} already open."
            exit 0
          fi
          labels=(--label "release" --label "needs-review")
          case "${target}" in
            stable|main) labels+=(--label "needs-operator") ;;
          esac
          gh pr create \
            --head "${release_branch}" \
            --base "${target}" \
            --title "Promote ${release_branch} → ${target}" \
            --body "$(printf 'Automated promotion opened by promote.yml reconciliation after %s moved.\n\nCandidate: `%s` @ %s\nGates for **%s** are in RELEASE.md. A maintainer with write access must select **Approve workflows to run** before the required checks start. Player channels (`stable`, `main`) require owner signoff (`needs-operator`) before merge.' "${release_branch}" "${release_branch}" "$(git rev-parse --short "origin/${release_branch}")" "${target}")" \
            "${labels[@]}"

      # Next rung: a release/* branch was merged into unstable/stable -> open the
      # PR to the rung above it.
      - name: Open next-rung PR (release/* -> next channel)
        if: github.event_name == 'push' && !startsWith(github.ref_name, 'release/')
        run: |
          set -euo pipefail
          merged="${GITHUB_REF_NAME}"   # the channel just pushed to
          case "${merged}" in
            unstable) target="stable" ;;
            stable)   target="main" ;;
            *) echo "no next rung for ${merged}"; exit 0 ;;
          esac
          # Identify the release/* branch THIS push promoted, from the
          # triggering merge commit's own ancestry -- not a namespace-wide
          # committer-date scan, which can't tell a branch's activity apart
          # from which branch was actually just merged (issue #135: a
          # long-lived maintenance release/* line with a newer tip must
          # never shadow the release branch this push named).
          set +e
          release_branch="$(scripts/select_promoted_release.sh "${GITHUB_SHA}")"
          select_rc=$?
          set -e
          # exit 4 = branch advanced past the merged commit; the rung walk
          # below routes that to a re-clear. Anything else nonzero is an
          # error (ambiguous topology etc.) — surface it.
          if [ "${select_rc}" -ne 0 ] && [ "${select_rc}" -ne 4 ]; then
            exit "${select_rc}"
          fi
          if [ -z "${release_branch}" ]; then
            echo "No release/* branch merged into ${merged}; nothing to promote."
            exit 0
          fi
          # Re-fetch the LIVE tip: `gh pr create --head` binds to the
          # branch's server-side tip, not the checkout snapshot the selector
          # classified — routing must use what the PR will actually carry.
          git fetch origin "+refs/heads/${release_branch}:refs/remotes/origin/${release_branch}"
          # Route to the LOWEST rung the live tip has not cleared: the rung
          # above the one just pushed for a stationary tip, or a re-clear of
          # an earlier rung for a tip that advanced (never a higher rung the
          # new commits have not earned).
          target="$(scripts/select_promotion_target.sh "${release_branch}")"
          if [ -z "${target}" ]; then
            echo "${release_branch} already contained in every channel; nothing to open."
            exit 0
          fi
          second_parent="$(git rev-parse "${GITHUB_SHA}^2")"
          # `gh pr create` binds the PR to the LIVE server-side tip, which
          # can advance past the tip the routing above used. After creating,
          # re-read the PR's actual head OID; if it moved AND that changes
          # the routing, close the misrouted PR and re-open at the correct
          # rung. Bounded retries — a branch that keeps advancing mid-run
          # fails loudly rather than looping.
          attempt=0
          while :; do
            attempt="$(( attempt + 1 ))"
            existing="$(gh pr list --head "${release_branch}" --base "${target}" --state open --json number --jq 'length')"
            if [ "${existing}" != "0" ]; then
              echo "Promotion PR ${release_branch} -> ${target} already open."
              exit 0
            fi
            labels=(--label "release" --label "needs-review")
            case "${target}" in
              stable|main) labels+=(--label "needs-operator") ;;
            esac
            if [ "$(git rev-parse "origin/${release_branch}")" != "${second_parent}" ]; then
              reason="Automated re-clear promotion opened by promote.yml: ${release_branch} advanced past the commit just merged into ${merged}, so its new tip must re-clear ${target}."
            else
              reason="Automated next-rung promotion opened by promote.yml after ${release_branch} merged into ${merged}."
            fi
            pr_url="$(gh pr create \
              --head "${release_branch}" \
              --base "${target}" \
              --title "Promote ${release_branch} → ${target}" \
              --body "$(printf '%s\n\nCandidate: `%s` @ %s\nGates for **%s** are in RELEASE.md. A maintainer with write access must select **Approve workflows to run** before the required checks start. Player channels (`stable`, `main`) require owner signoff (`needs-operator`) before merge.' "${reason}" "${release_branch}" "$(git rev-parse --short "origin/${release_branch}")" "${target}")" \
              "${labels[@]}")"
            routed_tip="$(git rev-parse "origin/${release_branch}")"
            created_head="$(gh pr view "${pr_url}" --json headRefOid --jq .headRefOid)"
            if [ "${created_head}" = "${routed_tip}" ]; then
              exit 0
            fi
            # The branch advanced inside the routing->create window. The PR
            # follows the LIVE branch tip (created_head is already stale the
            # moment it is read), so refetch and re-route from the live tip.
            git fetch origin "+refs/heads/${release_branch}:refs/remotes/origin/${release_branch}"
            new_target="$(scripts/select_promotion_target.sh "${release_branch}")"
            if [ "${new_target}" = "${target}" ]; then
              echo "${release_branch} advanced during PR creation but the routing is unchanged."
              exit 0
            fi
            gh pr close "${pr_url}" --comment "Head advanced past the tip this PR was routed for; re-routing to ${new_target:-none (now contained in every channel)}."
            if [ -z "${new_target}" ]; then
              echo "${release_branch} now contained in every channel; nothing to open."
              exit 0
            fi
            if [ "${attempt}" -ge 3 ]; then
              echo "${release_branch} keeps advancing mid-run; giving up after ${attempt} attempts." >&2
              exit 1
            fi
            target="${new_target}"
          done
