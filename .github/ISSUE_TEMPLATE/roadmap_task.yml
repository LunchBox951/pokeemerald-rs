name: Roadmap task
description: A unit of roadmap work that ladders up to a v1 acceptance criterion.
labels: ["needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Roadmap work lives in GitHub, not in committed plan docs (constitution-vs-roadmap).
        Each task names the stable acceptance ID in docs/acceptance/v1.md it advances,
        or `none` with a concrete rationale.
  - type: textarea
    id: task
    attributes:
      label: Task
      description: The bounded slice of work to do.
    validations:
      required: true
  - type: input
    id: acceptance
    attributes:
      label: Laddered acceptance ID
      description: The one stable acceptance ID in docs/acceptance/v1.md this task satisfies, e.g. F-7, or `none` with a concrete rationale.
      placeholder: "F-7"
    validations:
      required: true
  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of done
      description: Objective, checkable outcomes. CI green plus review is the floor (gated-by-default).
    validations:
      required: true
  - type: textarea
    id: revisit-when
    attributes:
      label: Revisit when
      description: >-
        Deferred (M8) work only: the observable conditions that return this
        issue to active work. See CONTRIBUTING.md "Where work goes".
    validations:
      required: false
