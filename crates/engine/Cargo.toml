[package]
name = "engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace-local path dependency, not an external crate -- `minimal-deps`
# owner approval does not apply (see `pokeemerald-rs`'s `Cargo.toml` for the
# identical reasoning). `overworld` (issue #108) reuses `assets`' typed map
# headers/connections/events and its `LayoutGrid`/`MetatileAttributeTable`
# decode layer rather than redefining them; `assets` depends only on the std-only
# `pack-format`, so this does not drag anything new into engine's build.
assets = { path = "../assets" }

[dev-dependencies]
# The same workspace-local crate with its test-only seam enabled: unit tests
# build synthetic font sheets via FontImageRef::new_for_tests. The feature is
# dev-only, so production builds keep the pack-mediated pairing guarantee.
assets = { path = "../assets", features = ["test-support"] }
