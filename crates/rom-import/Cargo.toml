[package]
name = "rom-import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The importer's output side. Both are in-workspace crates, not new external
# dependencies; this crate takes no others (minimal-deps). `assets` owns the
# audio schemas (`Sample`, `VoiceGroup`, `Song`) and their wire encoders,
# which the audio domains emit through rather than duplicate.
assets = { path = "../assets" }
pack-format = { path = "../pack-format" }

# The one external crate this package names (`minimal-deps`; S-4, issue
# #1132): closes `classify_partial_file`'s Windows handle-bound cleanup
# delete (see `WindowsFileIdentity` in `src/lib.rs`). Approval trail, exact
# version, and feature boundary are recorded in the dependency ledger
# (`README.md`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[lints]
workspace = true
