[package]
name = "rom-import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The importer's output side. Both are in-workspace crates, not new external
# dependencies; this crate takes no others (minimal-deps). `assets` owns the
# audio schemas (`Sample`, `VoiceGroup`, `Song`) and their wire encoders,
# which the audio domains emit through rather than duplicate.
assets = { path = "../assets" }
pack-format = { path = "../pack-format" }

# The one external crate this package names, added with owner approval
# extending #914's approval to this issue (`minimal-deps`; S-4, issue #1132,
# https://github.com/LunchBox951/pokeemerald-rs/issues/1132#issuecomment-5654427839).
# `remove_after`'s Windows cleanup has to delete the partial file it just
# created through the same handle its identity check opens, so a retargeted
# ancestor cannot make the delete step re-resolve `path` onto a different
# object; no `std` API exposes `GetFileInformationByHandle` or
# `SetFileInformationByHandle` on stable Rust. Windows-only, pinned to the
# version already in `Cargo.lock`, and default features disabled with only
# `Win32_Foundation` and `Win32_Storage_FileSystem` enabled, exactly the
# feature boundary the approval sets.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[lints]
workspace = true
