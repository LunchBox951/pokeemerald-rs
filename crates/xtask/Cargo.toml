[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The asset-pack container format `extract` writes. In-workspace, std-only,
# not a new external dependency.
pack-format = { path = "../pack-format" }
# `gen-rom-profile` reads a real cartridge image through the importer's own
# `Rom`/`RomReader`/`lz77_decompress`, and writes the `Roots` table that
# crate ships. In-workspace, std-only, not a new external dependency; the
# dependency runs one way only -- `rom-import` never depends on `xtask`.
rom-import = { path = "../rom-import" }
# The `e2e --suite smoke` run (F-3, V-1), `record-snapshot` (F-3, V-4),
# and `scenario` (F-3, issue #233) drive headless scenes from
# `pokeemerald-rs` in-process. The dependency is optional and
# gated behind the `scenes` feature (below):
# unconditionally depending on `pokeemerald-rs` would transitively drag
# `platform` (and its `cpal`/`winit`/`softbuffer`, i.e. ALSA dev headers on
# Linux) into every `xtask` subcommand's build -- `extract` included --
# when pre-feature-split `xtask` was std-only. Only subcommands that need a
# real scene pull it in; `cargo build -p xtask` without those features
# stays dependency-free.
pokeemerald-rs = { path = "../pokeemerald-rs", optional = true }
# The backend-neutral audio-pack schema `gen_rom_profile::audio` validates
# `DirectSound` sample payloads against (`Sample::decode`), and
# `record-snapshot` also loads the pack directly (`AssetPack::load`, not
# just `pokeemerald_rs::title::load_default`'s fixed-path convenience) so
# its determinism/metadata tests can point at a scratch synthetic pack
# instead of the one real, developer-local pack path -- see
# `crate::record_snapshot`'s module docs. In-workspace, std-only, not a
# new external dependency; not gated behind `scenes` because
# `gen-rom-profile` needs it unconditionally.
assets = { path = "../assets" }

# Snapshot payload writes use held directories; promotion atomically refuses replacement.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = [
    "std",
    "fs",
], optional = true }

# `record-snapshot` and the extract pack publish compare a fresh open of a path
# with the handle they hold on Windows through the same identity query
# `rom-import` uses. Unconditional on Windows because extraction is not behind
# `scenes`. Same crate, same pinned version and feature boundary; recorded in
# `README.md`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[features]
# Pulls in the workspace-local scene drivers `smoke`, `record-snapshot`,
# and `scenario` need. Not selected directly by a caller -- always reached
# through one of those subcommand features. `mod
# record_snapshot` is `#[cfg]`d on *this* feature rather than on
# `record-snapshot`, so CI's `cargo test -p xtask --features smoke` leg
# compiles and runs its synthetic-pack tests (see `main.rs`'s crate docs).
scenes = ["dep:pokeemerald-rs", "dep:rustix"]
smoke = ["scenes"]
record-snapshot = ["scenes"]
scenario = ["scenes"]
# Selects the committed-profile drift check, which needs a developer-local
# $POKEEMERALD_ROM. CI's `--ignored` legs run without a ROM by policy, so
# the test is compiled out of them and fails hard (never skips) when the
# feature is on but the ROM is absent:
# `cargo test -p xtask --features rom-drift -- --ignored`.
rom-drift = []
