[package]
name = "pokeemerald-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace-local path dependencies, not external crates -- `minimal-deps`
# owner approval does not apply (see `xtask`'s `Cargo.toml` for the identical
# reasoning). `assets` is the I-2 title-screen pack loader
# (`crate::title::load_default`); it depends only on the std-only `pack-format`, so
# adding it here does not drag anything new into `xtask`'s `smoke`-gated
# `pokeemerald-rs` dependency either. `engine` (I-3, issue #126) supplies
# `overworld::PlayerState`/`Direction` -- the tile position/facing/step-progress
# state `crate::overworld` reads to compose a frame; `engine` itself only
# depends on `assets`, so this does not drag anything new in either.
assets = { path = "../assets" }
# `battle` (I-4, issue #169) is the wild-battle turn engine the overworld's
# per-step encounter roll hands off to (`crate::flow::wild_encounter`): a
# rolled species/level becomes a `battle::BattlePokemon` and then a
# `battle::Battle`. Workspace-local as well, and `battle` itself depends only
# on `assets`, so nothing new enters the build.
battle = { path = "../battle" }
# `audio` (S-3, issue #185) is the M4A sequencer/mixer/reverb engine
# `crate::music` bridges the asset pack's song/voicegroup/sample entries
# into: the App advances it one frame at a time to play the title screen's
# BGM. Workspace-local, and `audio` itself depends on no external crate
# either (only a dev-dependency on `platform`, unused here), so this drags
# nothing new into the build.
audio = { path = "../audio" }
engine = { path = "../engine" }
platform = { path = "../platform" }
rendering = { path = "../rendering" }

[dev-dependencies]
# The same workspace-local `assets` crate with its test-only seam enabled
# (mirrors `engine`'s `Cargo.toml`): `main_menu`/`intro`'s unit tests build
# synthetic font sheets via `FontImageRef::new_for_tests` without a local
# asset pack. Dev-only, so production builds keep the pack-mediated pairing
# guarantee.
assets = { path = "../assets", features = ["test-support"] }
