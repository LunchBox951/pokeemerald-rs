[workspace]
resolver = "2"
members = [
    "crates/platform",
    "crates/rendering",
    "crates/audio",
    "crates/assets",
    "crates/engine",
    "crates/battle",
    "crates/pokeemerald-rs",
    "crates/xtask",
]

# Shared package metadata inherited by every member via `field.workspace = true`.
[workspace.package]
edition = "2021"
# Keep this in lockstep with rust-toolchain.toml in a dedicated maintenance PR.
rust-version = "1.97.1"
version = "0.0.27+gamepatch.134"
publish = false

# Workspace-wide lints (F-2). Inherited by every member via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# Lower priority so the specific lint above wins over this group (clippy::lint_groups_priority).
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Lower priority so narrowly configured lints below take precedence over the group.
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
